repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: [--line-length=80]

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.3

    hooks:
      - id: autoflake

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.21
    hooks:
      - id: uv-lock

  - repo: https://github.com/BartSte/pre-commit-hooks
    rev: v1.1.4
    hooks:
      - id: run-third-party-license-generator
        args: [-g]
